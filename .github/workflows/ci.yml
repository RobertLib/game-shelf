name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api: ['api/**', 'openapi/**', '.github/workflows/ci.yml']
            android: ['android/**', '.github/workflows/ci.yml']
            ios: ['ios/**', '.github/workflows/ci.yml']

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gameshelf
          POSTGRES_PASSWORD: gameshelf
          POSTGRES_DB: game_shelf_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gameshelf"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: cp .env.test.example .env.test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e
      - name: OpenAPI spec is up to date
        run: |
          npm run openapi
          git diff --exit-code ../openapi/openapi.yaml

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleDebug testDebugUnitTest

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          xcodebuild -project ios/GameShelf.xcodeproj -scheme GameShelf \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO test
