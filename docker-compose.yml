# Local PostgreSQL for the API: `docker compose up -d`
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: gameshelf
      POSTGRES_PASSWORD: gameshelf
      POSTGRES_DB: game_shelf
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameshelf -d game_shelf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
