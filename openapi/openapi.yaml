openapi: 3.0.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
      summary: Liveness probe
      tags:
        - health
  /api/v1/auth/register:
    post:
      operationId: register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict with existing data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      summary: Create an account and sign in
      tags:
        - auth
  /api/v1/auth/login:
    post:
      operationId: login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      summary: Sign in with e-mail and password
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      summary: Exchange a refresh token for a new token pair
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "204":
          description: ""
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      summary: Revoke a refresh token
      tags:
        - auth
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Profile of the signed-in user
      tags:
        - auth
    delete:
      operationId: deleteAccount
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: ""
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Delete the account and the whole collection
      tags:
        - auth
  /api/v1/auth/change-password:
    post:
      description: Signs out all sessions (every refresh token is revoked) and returns
        a new token pair for the current device. Fails with
        `INVALID_CURRENT_PASSWORD` when the current password is wrong.
      operationId: changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Change password
      tags:
        - auth
  /api/v1/games:
    get:
      operationId: listGames
      parameters:
        - name: q
          required: false
          in: query
          description: Full-text search in title, edition, developer, publisher, genre,
            product code, barcode and notes. Every whitespace-separated word
            must match (case-insensitive).
          schema:
            example: zelda ocarina
            type: string
        - name: platform
          required: false
          in: query
          description: Platforms. Repeat the parameter or separate values with commas;
            values are OR-ed.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Platform"
        - name: status
          required: false
          in: query
          description: Collection statuses. Repeat the parameter or separate values with
            commas; values are OR-ed.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/CollectionStatus"
        - name: format
          required: false
          in: query
          description: Formats. Repeat the parameter or separate values with commas;
            values are OR-ed.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/GameFormat"
        - name: region
          required: false
          in: query
          description: Regions. Repeat the parameter or separate values with commas;
            values are OR-ed.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Region"
        - name: completeness
          required: false
          in: query
          description: Completeness levels. Repeat the parameter or separate values with
            commas; values are OR-ed.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Completeness"
        - name: condition
          required: false
          in: query
          description: Conditions. Repeat the parameter or separate values with commas;
            values are OR-ed.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Condition"
        - name: playStatus
          required: false
          in: query
          description: Play statuses. Repeat the parameter or separate values with commas;
            values are OR-ed.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PlayStatus"
        - name: genre
          required: false
          in: query
          description: Exact genres (case-insensitive). Repeat the parameter or separate
            values with commas; values are OR-ed.
          schema:
            type: array
            items:
              type: string
        - name: publisher
          required: false
          in: query
          description: Publisher contains (case-insensitive).
          schema:
            type: string
        - name: developer
          required: false
          in: query
          description: Developer contains (case-insensitive).
          schema:
            type: string
        - name: storageLocation
          required: false
          in: query
          description: Storage location contains (case-insensitive).
          schema:
            type: string
        - name: favorite
          required: false
          in: query
          description: Only favourites (true) or only non-favourites (false).
          schema:
            type: boolean
        - name: hasCover
          required: false
          in: query
          description: Only games with (true) or without (false) a cover image.
          schema:
            type: boolean
        - name: releaseYearFrom
          required: false
          in: query
          schema:
            minimum: 1950
            maximum: 2100
            type: integer
        - name: releaseYearTo
          required: false
          in: query
          schema:
            minimum: 1950
            maximum: 2100
            type: integer
        - name: purchaseDateFrom
          required: false
          in: query
          schema:
            format: date
            example: 2024-01-01
            type: string
        - name: purchaseDateTo
          required: false
          in: query
          schema:
            format: date
            example: 2024-12-31
            type: string
        - name: purchasePriceMin
          required: false
          in: query
          schema:
            minimum: 0
            type: number
        - name: purchasePriceMax
          required: false
          in: query
          schema:
            minimum: 0
            type: number
        - name: estimatedValueMin
          required: false
          in: query
          schema:
            minimum: 0
            type: number
        - name: estimatedValueMax
          required: false
          in: query
          schema:
            minimum: 0
            type: number
        - name: ratingMin
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 10
            type: integer
        - name: ratingMax
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 10
            type: integer
        - name: sort
          required: false
          in: query
          description: Games without a value in the sorted field always come last.
            `platform` sorts by manufacturer and generation (the order of the
            Platform enum), not alphabetically.
          schema:
            $ref: "#/components/schemas/GameSortField"
        - name: order
          required: false
          in: query
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: integer
        - name: pageSize
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 25
            type: integer
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamePage"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: List the collection with filtering, sorting and pagination
      tags:
        - games
    post:
      description: "With a client-generated `id` the call is idempotent: if the game
        already exists, it is returned unchanged with 200, or 404 when it has
        been deleted meanwhile."
      operationId: createGame
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "200":
          description: Already existed, unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict with existing data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Add a game to the collection
      tags:
        - games
  /api/v1/games/facets:
    get:
      operationId: getGameFacets
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameFacets"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Distinct values in the collection for building filters
      tags:
        - games
  /api/v1/games/changes:
    get:
      description: "Games created, changed or deleted after `cursor`, oldest change
        first. Start without a cursor, then keep calling with the returned
        `cursor` while `hasMore` is true. 410 SYNC_RESET_REQUIRED means the
        cursor cannot be continued: drop the synced data and start again without
        a cursor."
      operationId: listGameChanges
      parameters:
        - name: cursor
          required: false
          in: query
          description: "`cursor` from the previous response. Omit it to get every game
            from the beginning."
          schema:
            example: "42"
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 1000
            default: 500
            type: integer
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameChanges"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The sync cursor can no longer be continued; start again without it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Change feed for offline clients
      tags:
        - games
  /api/v1/games/{id}:
    get:
      operationId: getGame
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Get one game
      tags:
        - games
    put:
      description: "Full replacement: omitted optional fields are cleared, omitted
        defaults are reset."
      operationId: updateGame
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveGameRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Replace a game
      tags:
        - games
    patch:
      description: Only the fields present in the body change; `null` clears an
        optional field.
      operationId: patchGame
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameRequest"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Change some fields of a game
      tags:
        - games
    delete:
      description: Deleting a game that is already deleted also succeeds.
      operationId: deleteGame
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      responses:
        "204":
          description: ""
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Remove a game from the collection
      tags:
        - games
  /api/v1/lookup/barcode/{barcode}:
    get:
      description: "Looks the EAN / UPC up in external databases and returns details
        to prefill a new game with; nothing is saved. 404 `BARCODE_NOT_FOUND`:
        the code is not known. 503 `LOOKUP_UNAVAILABLE`: the database cannot be
        reached or its daily limit is used up."
      operationId: lookupBarcode
      parameters:
        - name: barcode
          required: true
          in: path
          description: EAN / UPC (8–14 digits).
          schema:
            pattern: ^[0-9]{8,14}$
            example: "045496420055"
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarcodeLookup"
        "400":
          description: Invalid input (see `code` and `details`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid or expired credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: An external service the endpoint relies on is unavailable; try
            again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - bearer: []
      summary: Find a game by the barcode on its box
      tags:
        - lookup
info:
  title: Game Shelf API
  description: >-
    REST API of Game Shelf – a catalogue for collectors of computer and console
    games.


    Authenticate with `POST /api/v1/auth/login` or `/register` and send the
    access token as `Authorization: Bearer <token>`. When it expires (401),
    exchange the refresh token at `POST /api/v1/auth/refresh`.


    Every error has the shape of `ErrorResponse`; branch on its `code`.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: collector@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          example: super-secret-123
        displayName:
          type: string
          nullable: true
          maxLength: 100
          example: Retro Rob
      required:
        - email
        - password
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: collector@example.com
        displayName:
          type: string
          nullable: true
          example: Retro Rob
        createdAt:
          format: date-time
          type: string
      required:
        - id
        - email
        - displayName
        - createdAt
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "Short-lived JWT for the `Authorization: Bearer` header."
        expiresIn:
          type: integer
          description: Expiry of the access token in seconds.
          example: 900
        refreshToken:
          type: string
          description: Opaque single-use token for POST /auth/refresh. Every refresh
            returns a new one; reusing an old token revokes all sessions of the
            user.
        user:
          $ref: "#/components/schemas/User"
      required:
        - accessToken
        - expiresIn
        - refreshToken
        - user
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - INVALID_REFRESH_TOKEN
        - INVALID_CURRENT_PASSWORD
        - EMAIL_ALREADY_REGISTERED
        - GAME_NOT_FOUND
        - SYNC_RESET_REQUIRED
        - BARCODE_NOT_FOUND
        - LOOKUP_UNAVAILABLE
        - NOT_FOUND
        - TOO_MANY_REQUESTS
        - BAD_REQUEST
        - FORBIDDEN
        - CONFLICT
        - INTERNAL_ERROR
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        code:
          allOf:
            - $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          example: Validation failed
        details:
          description: Individual validation messages, present for VALIDATION_FAILED.
          example:
            - email must be an email
          type: array
          items:
            type: string
      required:
        - statusCode
        - code
        - message
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: collector@example.com
        password:
          type: string
          format: password
          example: super-secret-123
      required:
        - email
        - password
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword
    DeleteAccountRequest:
      type: object
      properties:
        password:
          type: string
          format: password
          description: Current password as a confirmation.
      required:
        - password
    Platform:
      type: string
      enum:
        - PC
        - MAC
        - PS1
        - PS2
        - PS3
        - PS4
        - PS5
        - PSP
        - PS_VITA
        - XBOX
        - XBOX_360
        - XBOX_ONE
        - XBOX_SERIES
        - NES
        - SNES
        - N64
        - GAMECUBE
        - WII
        - WII_U
        - SWITCH
        - SWITCH_2
        - GAME_BOY
        - GAME_BOY_COLOR
        - GAME_BOY_ADVANCE
        - NINTENDO_DS
        - NINTENDO_3DS
        - VIRTUAL_BOY
        - MASTER_SYSTEM
        - MEGA_DRIVE
