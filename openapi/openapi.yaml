    GameChanges:
      type: object
      properties:
        games:
          description: Games created or changed after the cursor.
          type: array
          items:
            $ref: "#/components/schemas/Game"
        deletedIds:
          description: Ids of games deleted after the cursor.
          type: array
          items:
            type: string
            format: uuid
        cursor:
          type: string
          description: Opaque position in the feed. Send it with the next call; store it
            together with the data of this page.
          example: "42"
        hasMore:
          type: boolean
          description: More changes are waiting; call again right away with the new cursor.
      required:
        - games
        - deletedIds
        - cursor
        - hasMore
    CreateGameRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          example: "The Legend of Zelda: Ocarina of Time"
        platform:
          example: N64
          allOf:
            - $ref: "#/components/schemas/Platform"
        status:
          default: OWNED
          allOf:
            - $ref: "#/components/schemas/CollectionStatus"
        format:
          default: PHYSICAL
          allOf:
            - $ref: "#/components/schemas/GameFormat"
        region:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Region"
        edition:
          type: string
          nullable: true
          maxLength: 100
          example: Collector's Edition
        completeness:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Completeness"
        condition:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Condition"
        playStatus:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlayStatus"
        genre:
          type: string
          nullable: true
          maxLength: 100
          example: Action-adventure
        developer:
          type: string
          nullable: true
          maxLength: 100
          example: Nintendo EAD
        publisher:
          type: string
          nullable: true
          maxLength: 100
          example: Nintendo
        releaseYear:
          type: integer
          nullable: true
          minimum: 1950
          maximum: 2100
          example: 1998
        barcode:
          type: string
          nullable: true
          pattern: ^[0-9]{8,14}$
          description: EAN / UPC (8–14 digits).
          example: "045496870058"
        productCode:
          type: string
          nullable: true
          maxLength: 50
          description: Catalogue / serial number from the media or spine.
          example: NUS-NZLP-EUR
        quantity:
          type: integer
          minimum: 1
          maximum: 999
          default: 1
        purchasePrice:
          type: number
          nullable: true
          minimum: 0
          example: 1299.9
        purchaseDate:
          type: string
          format: date
          nullable: true
          example: 2024-05-17
        purchasePlace:
          type: string
          nullable: true
          maxLength: 100
          example: Flea market
        estimatedValue:
          type: number
          nullable: true
          minimum: 0
          example: 2500
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: CZK
          description: ISO 4217 currency of purchasePrice and estimatedValue.
          example: CZK
        storageLocation:
          type: string
          nullable: true
          maxLength: 100
          example: Shelf A, row 3
        rating:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10
          example: 9
        favorite:
          type: boolean
          default: false
        coverImageUrl:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
        notes:
          type: string
          nullable: true
          maxLength: 5000
        id:
          type: string
          format: uuid
          description: Client-generated id. When a game with this id already exists, it is
            returned unchanged (200).
      required:
        - title
        - platform
